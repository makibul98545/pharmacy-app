name: MM LifeCare Pharmacy Agent
version: 1.0.0
schema: v1

models:
  - name: Qwen3 8B Agent
    provider: ollama
    model: qwen3:8b
    apiBase: http://localhost:11434
    roles:
      - chat
      - edit
      - apply
    capabilities:
      - tool_use

  - name: Qwen 2.5 Coder 1.5B Autocomplete
    provider: ollama
    model: qwen2.5-coder:1.5b
    apiBase: http://localhost:11434
    roles:
      - autocomplete
    autocompleteOptions:
      debounceDelay: 350
      maxPromptTokens: 1024
      onlyMyCode: true